name: 爬蟲 - 大樂透

on:
  schedule:
    # 2026-09-05 調整：比照 scrape-539.yml，從「一天只在台灣 21:30（UTC 13:30）觸發
    # 一次」改成「20:30 主觸發 + 23:00 備援觸發」兩個時間點。
    # 原因與對策詳見 scrape-539.yml 的說明：GitHub schedule 實測常延遲
    # 3~4 小時以上，單次觸發延遲一跨夜就整期漏抓。主觸發提前約 1 小時
    # （大樂透 20:30 開獎、約 21:00 後陸續公布），靠 lottery_scraper.py 內部最長 330 分鐘的重試迴圈等結果
    # 公布；備援觸發防主觸發被整個跳過，若已確認會在幾秒內被
    # 「今天這期已確認」檢查擋下，幾乎不耗資源。兩個觸發共用 concurrency
    # group，不會同時重複執行。
    - cron: "30 12 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lottery-scraper-lotto649
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper（內部會重試到確認為止，最長約 5.5 小時）
        id: run
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          STATE_DIR: state
        run: python lottery_scraper.py --game lotto649

      - name: 提交狀態檔案（lottery.db / status.json / source_health.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新爬蟲狀態 (lotto649) [skip ci]"
          git pull --rebase origin main
          git push
