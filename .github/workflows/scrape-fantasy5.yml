name: 爬蟲 - 加州天天樂

on:
  schedule:
    # 2026-09-05 調整：比照 scrape-539.yml，從「一天只在台灣 11:15（UTC 03:15）觸發
    # 一次」改成「10:15 主觸發 + 12:45 備援觸發」兩個時間點。
    # 原因與對策詳見 scrape-539.yml 的說明：GitHub schedule 實測常延遲
    # 3~4 小時以上，單次觸發延遲一跨夜就整期漏抓。主觸發提前約 1 小時
    # （加州天天樂美西晚間開獎，換算台灣約上午公布），靠 lottery_scraper.py 內部最長 330 分鐘的重試迴圈等結果
    # 公布；備援觸發防主觸發被整個跳過，若已確認會在幾秒內被
    # 「今天這期已確認」檢查擋下，幾乎不耗資源。兩個觸發共用 concurrency
    # group，不會同時重複執行。
    - cron: "15 2 * * *"
    - cron: "45 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lottery-scraper-fantasy5
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper（內部會重試到確認為止，最長約 5.5 小時）
        id: run
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          STATE_DIR: state
        run: python lottery_scraper.py --game fantasy5

      - name: 提交狀態檔案（lottery.db / status.json / source_health.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新爬蟲狀態 (fantasy5) [skip ci]"
          git pull --rebase origin main
          git push
