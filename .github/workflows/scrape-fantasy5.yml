name: 爬蟲 - 加州天天樂

on:
  schedule:
    # 加州天天樂每天開獎（美西晚上 18:30），結果通常台灣時間上午 10-11 點
    # 左右才會公布。搜尋時段：從台灣 11:00 開始，每小時一次，一路到
    # 隔天 00:00 為止，沒抓到就等明天。
    # 換算 UTC：每天 3~16 點（其中 16 點對應台灣隔天 00:00）。
    - cron: "0 3-16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: lottery-scraper-fantasy5
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: run
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          STATE_DIR: state
        run: python lottery_scraper.py --game fantasy5

      - name: 提交狀態檔案（lottery.db / status.json / source_health.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新爬蟲狀態 (加州天天樂) [skip ci]"
          git pull --rebase origin main
          git push

      - name: 今天已確認，停用本排程直到明天（凌晨會自動重新啟用）
        if: steps.run.outputs.confirmed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable "scrape-fantasy5.yml"
