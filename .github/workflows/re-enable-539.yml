name: 重新啟用今彩539排程（每天21:00週期）

# 今彩539 的搜尋週期改成以晚上 21:00 為起點（不是午夜）：從 21:00 開始
# 每小時搜尋一次，一旦確認成功就停用排程直到隔天 21:00，由這個 workflow
# 負責在每天 20:57（21:00 前 3 分鐘，預留緩衝時間）重新啟用，緊接著
# scrape-539.yml 21:07 那次觸發就能正常開始新一輪搜尋。
#
# 跟其他三個彩券共用的「每天 00:05 重新啟用」（re-enable-scrapers.yml）
# 是分開的兩個 workflow，因為 539 的重置時間點不一樣。
#
# 保險起見，重新啟用前會先用 --check-confirmed-only 檢查一次「今天」
# 是不是已經確認過了，已確認的話就跳過重新啟用，避免多此一舉。

on:
  schedule:
    # 台灣時間每天 20:57（UTC+8），換算 UTC 為 12:57
    - cron: "57 12 * * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  re-enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 檢查並重新啟用 - 今彩539
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: state
        run: |
          if python lottery_scraper.py --game 539 --check-confirmed-only; then
            echo "今彩539 今天已確認過，跳過重新啟用"
          else
            gh workflow enable "scrape-539.yml"
          fi
