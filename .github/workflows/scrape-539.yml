name: 爬蟲 - 今彩539

on:
  schedule:
    # 2026-09-05 調整：從「一天只在台灣 21:00（UTC 13:00）觸發一次」改成
    # 「20:00 主觸發 + 22:30 備援觸發」兩個時間點。
    #
    # 原因：實測 GitHub 的 schedule 觸發常常延遲 3~4 小時以上（9/2~9/5 的
    # 排程觸發實際都落在台灣半夜 12:43~3:22 之間），單靠一次 21:00 觸發，
    # 延遲一跨夜當晚就整期漏抓，只能靠使用者每晚手動觸發。
    #
    # 對策：
    # 1) 主觸發提前到台灣 20:00（UTC 12:00）。就算完全沒延遲，程式內部的
    #    重試迴圈（開獎日最長 330 分鐘，見 lottery_scraper.py）也會一路等到
    #    21:00 前後台彩公布結果為止；如果被延遲幾小時，啟動當下結果早就
    #    公布了，第一輪就能抓到。延遲到跨夜也沒關係，爬蟲有「補抓昨天」
    #    機制，會把該期用正確的開獎日期補存。
    # 2) 22:30（UTC 14:30）再加一個備援觸發，防的是主觸發被 GitHub「整個
    #    跳過」（不只是延遲）的情況。如果主觸發已經確認成功，備援這一輪
    #    會被「今天這期已確認」的檢查在幾秒內擋下，幾乎不耗資源。
    #
    # 兩個觸發共用下方的 concurrency group，不會同時重複執行（後到的會
    # 排隊等前一個結束）。
    - cron: "0 12 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lottery-scraper-539
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper（內部會重試到確認為止，最長約 5.5 小時）
        id: run
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          STATE_DIR: state
        run: python lottery_scraper.py --game 539

      - name: 提交狀態檔案（lottery.db / status.json / source_health.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新爬蟲狀態 (539) [skip ci]"
          git pull --rebase origin main
          git push
