name: 每日重新啟用四個爬蟲排程

# 四個 scrape-*.yml 一旦當天抓到資料，會自動呼叫 API 停用自己（避免當天
# 剩下的每小時觸發都在空轉）。這個 workflow 每天固定在台灣時間剛過午夜
# 時執行一次，把四個都重新啟用，讓新的一天可以繼續每小時嘗試。
#
# 保險起見，重新啟用前會先用 --check-confirmed-only 檢查一次「今天」
# 是不是已經確認過了（正常情況下剛跨過午夜、當天都還沒開獎，這裡幾乎
# 一定會是「尚未確認」，但保留這層檢查以防萬一，已確認的話就跳過該
# 彩券的重新啟用，避免多此一舉）。

on:
  schedule:
    # 台灣時間每天 00:05（UTC+8），換算 UTC 為前一天 16:05
    - cron: "5 16 * * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  re-enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 檢查並重新啟用 - 今彩539
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: state
        run: |
          if python lottery_scraper.py --game 539 --check-confirmed-only; then
            echo "今彩539 今天已確認過，跳過重新啟用"
          else
            gh workflow enable "scrape-539.yml"
          fi

      - name: 檢查並重新啟用 - 大樂透
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: state
        run: |
          if python lottery_scraper.py --game lotto649 --check-confirmed-only; then
            echo "大樂透 今天已確認過，跳過重新啟用"
          else
            gh workflow enable "scrape-lotto649.yml"
          fi

      - name: 檢查並重新啟用 - 香港六合彩
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: state
        run: |
          if python lottery_scraper.py --game marksix --check-confirmed-only; then
            echo "香港六合彩 今天已確認過，跳過重新啟用"
          else
            gh workflow enable "scrape-marksix.yml"
          fi

      - name: 檢查並重新啟用 - 加州天天樂
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: state
        run: |
          if python lottery_scraper.py --game fantasy5 --check-confirmed-only; then
            echo "加州天天樂 今天已確認過，跳過重新啟用"
          else
            gh workflow enable "scrape-fantasy5.yml"
          fi
