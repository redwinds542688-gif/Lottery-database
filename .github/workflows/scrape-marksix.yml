name: 爬蟲 - 香港六合彩
on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: lottery-scraper-marksix
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scraper
        id: run
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          STATE_DIR: state
        run: python lottery_scraper.py --game marksix
      - name: 提交狀態檔案（lottery.db / status.json / source_health.json）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "更新爬蟲狀態 (香港六合彩) [skip ci]"
          git pull --rebase origin main
          git push
      - name: 今天已確認（僅限自動排程觸發），停用本排程直到明天21:45（屆時會自動重新啟用）
        if: steps.run.outputs.confirmed == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable "scrape-marksix.yml"
