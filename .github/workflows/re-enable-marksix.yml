name: 重新啟用香港六合彩排程（每天21:45週期）

# 香港六合彩 的搜尋週期以台灣時間 21:45 為起點：從 21:45 開始每小時搜尋
# 一次，一旦確認成功就停用排程直到隔天 21:45，由這個 workflow 負責在每天
# 21:42（21:45 前 3 分鐘，預留緩衝時間）重新啟用，緊接著
# scrape-marksix.yml 21:52 那次觸發就能正常開始新一輪搜尋。
#
# 保險起見，重新啟用前會先用 --check-confirmed-only 檢查一次「今天」
# 是不是已經確認過了，已確認的話就跳過重新啟用，避免多此一舉。

on:
  schedule:
    - cron: "42 13 * * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  re-enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 檢查並重新啟用 - 香港六合彩
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: state
        run: |
          if python lottery_scraper.py --game marksix --check-confirmed-only; then
            echo "香港六合彩 今天已確認過，跳過重新啟用"
          else
            gh workflow enable "scrape-marksix.yml"
          fi
